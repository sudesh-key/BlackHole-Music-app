allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.value(rootProject.layout.projectDirectory.dir("../build"))

subprojects {
    project.layout.buildDirectory.value(rootProject.layout.buildDirectory.dir(project.name))

    // Safety net: inject a namespace into any legacy plugin that still relies
    // on the manifest `package` attribute (removed in AGP 8).
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") &&
                project.android.namespace == null) {
            def manifest = project.file("src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def pkg = new groovy.xml.XmlSlurper().parse(manifest).@package.text()
                if (pkg) {
                    project.android.namespace = pkg
                }
            }
        }

        // Plugins that still declare Java 8/11 clash with the Kotlin target,
        // which KGP 2.2 rejects outright instead of warning about.
        if (project.hasProperty("android")) {
            project.android.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
